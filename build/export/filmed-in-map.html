<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filmed in — map</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;height:100%;background:#0a0a0b;font-family:"Schibsted Grotesk",system-ui,sans-serif}
  #map{width:100%;height:100%;position:relative}
  svg{display:block;width:100%;height:100%}
  .country-filmed{cursor:pointer}
  #tooltip{position:absolute;pointer-events:none;background:rgba(10,10,11,.92);color:#f2f2f0;font-size:12px;font-weight:500;letter-spacing:.02em;padding:5px 9px;border:1px solid rgba(242,242,240,.16);border-radius:3px;opacity:0;transform:translate(-50%,-100%);white-space:nowrap;transition:opacity .15s ease;z-index:5}
</style>
</head>
<body>
<div id="map"><div id="tooltip"></div></div>
<script>
const FILMED = new Set([
  "united states of america","canada","mexico","brazil",
  "united kingdom","france","belgium","netherlands","luxembourg","germany",
  "switzerland","austria","czechia","poland","hungary","italy","spain","romania",
  "turkey","united arab emirates","qatar","armenia","kazakhstan","uzbekistan",
  "egypt","south africa","botswana","namibia","zimbabwe","tanzania","zambia","rwanda",
  "belize","bahamas","saint lucia","vatican"
]);
const ALIAS = {
  "united states":"united states of america",
  "czech republic":"czechia",
  "türkiye":"turkey",
  "united republic of tanzania":"tanzania",
  "w. sahara":"western sahara",
  "st. lucia":"saint lucia",
  "the bahamas":"bahamas",
  "england":"united kingdom",
  "scotland":"united kingdom",
  "the vatican":"vatican",
  "vatican city":"vatican"
};
const key = n => { const k = String(n || "").toLowerCase(); return ALIAS[k] || k; };
const DISPLAY_NAME = {
  "united states of america": "United States of America",
  "czechia": "Czech Republic",
  "saint lucia": "St. Lucia",
  "united republic of tanzania": "Tanzania",
  "united kingdom": "England / Scotland",
  "vatican": "The Vatican"
};
const displayName = raw => DISPLAY_NAME[key(raw)] || raw;

// Mainland-only clipping: keep polygons inside the listed lon/lat box (France's
// overseas departments in South America shouldn't light up with the European one).
const MAINLAND = { france: [-6, 41, 10, 52] };

// West edge clears Alaska mainland; east edge clears Kazakhstan; south edge clears Tierra del Fuego.
const LON0 = -168, LON1 = 88, LAT0 = 72, LAT1 = -56;
const RAD = Math.PI / 180;
const W = 900;
const SCALE = W / ((LON1 - LON0) * RAD);
const H = Math.round(SCALE * (LAT0 - LAT1) * RAD);
const TX = -SCALE * LON0 * RAD;
const TY = SCALE * LAT0 * RAD;

const FILL = "#ffffff", FILL_OFF = "#1e1e21", FILL_HL = "#ff5a36";
const POINTS = [
  { k: "saint lucia", coords: [-60.978, 13.909] },
  { k: "vatican", coords: [12.4534, 41.9029] }
];

function clipToMainland(feature) {
  const box = MAINLAND[key(feature.properties.name)];
  if (!box || feature.geometry.type !== "MultiPolygon") return feature;
  const [w0, s0, e0, n0] = box;
  const inside = feature.geometry.coordinates.filter(poly => {
    const ring = poly[0] || [];
    let lon = 0, lat = 0;
    ring.forEach(p => { lon += p[0]; lat += p[1]; });
    if (!ring.length) return false;
    lon /= ring.length; lat /= ring.length;
    return lon >= w0 && lon <= e0 && lat >= s0 && lat <= n0;
  });
  if (!inside.length) return feature;
  return Object.assign({}, feature, {
    geometry: { type: "MultiPolygon", coordinates: inside }
  });
}

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(topo => {
  const countries = topojson.feature(topo, topo.objects.countries).features.map(clipToMainland);
  const projection = d3.geoEquirectangular().scale(SCALE).translate([TX, TY]);
  projection.clipExtent([[0, 0], [W, H]]);
  const path = d3.geoPath(projection);

  const svg = d3.select("#map").insert("svg", "#tooltip")
    .attr("viewBox", "0 0 " + W + " " + H)
    .attr("preserveAspectRatio", "xMidYMid meet");

  svg.append("rect").attr("width", W).attr("height", H).attr("fill", "#101012");
  const tooltip = d3.select("#tooltip");

  const post = k => {
    if (window.parent === window) return;
    window.parent.postMessage({ type: "map-hover", key: k }, "*");
  };
  const place = event => {
    const rect = document.getElementById("map").getBoundingClientRect();
    tooltip.style("left", (event.clientX - rect.left) + "px")
           .style("top", (event.clientY - rect.top - 10) + "px");
  };

  const shapes = svg.append("g").selectAll("path")
    .data(countries)
    .join("path")
    .attr("d", path)
    .attr("class", d => FILMED.has(key(d.properties.name)) ? "country-filmed" : "")
    .attr("data-key", d => key(d.properties.name))
    .attr("fill", d => FILMED.has(key(d.properties.name)) ? FILL : FILL_OFF)
    .attr("stroke", "#0a0a0b")
    .attr("stroke-width", d => FILMED.has(key(d.properties.name)) ? 0.6 : 0.5)
    .style("transition", "fill .2s ease")
    .on("mouseenter", function (event, d) {
      const k = key(d.properties.name);
      if (!FILMED.has(k)) return;
      d3.select(this).attr("fill", FILL_HL);
      tooltip.style("opacity", 1).text(displayName(d.properties.name));
      post(k);
    })
    .on("mousemove", function (event, d) {
      if (!FILMED.has(key(d.properties.name))) return;
      place(event);
    })
    .on("mouseleave", function (event, d) {
      const k = key(d.properties.name);
      if (!FILMED.has(k)) return;
      d3.select(this).attr("fill", FILL);
      tooltip.style("opacity", 0);
      post(null);
    });

  const dots = svg.append("g").selectAll("circle")
    .data(POINTS.map(p => Object.assign({}, p, { xy: projection(p.coords) })).filter(p => p.xy))
    .join("circle")
    .attr("class", "country-filmed")
    .attr("data-key", d => d.k)
    .attr("cx", d => d.xy[0]).attr("cy", d => d.xy[1]).attr("r", 3)
    .attr("fill", FILL)
    .style("transition", "fill .2s ease")
    .on("mouseenter", function (event, d) {
      d3.select(this).attr("fill", FILL_HL);
      tooltip.style("opacity", 1).text(DISPLAY_NAME[d.k] || d.k);
      post(d.k);
    })
    .on("mousemove", function (event) { place(event); })
    .on("mouseleave", function () {
      d3.select(this).attr("fill", FILL);
      tooltip.style("opacity", 0);
      post(null);
    });

  window.addEventListener("message", e => {
    const msg = e.data || {};
    if (msg.type !== "map-highlight") return;
    const k = msg.key ? key(msg.key) : null;
    shapes.attr("fill", d => {
      const dk = key(d.properties.name);
      if (!FILMED.has(dk)) return FILL_OFF;
      return dk === k ? FILL_HL : FILL;
    });
    dots.attr("fill", d => (d.k === k ? FILL_HL : FILL));
  });

  const matched = new Set(countries.map(d => key(d.properties.name)).filter(n => FILMED.has(n)));
  const missing = [...FILMED].filter(n => !matched.has(n) && !POINTS.some(p => p.k === n));
  if (missing.length) console.warn("Unmatched country names:", missing);
});
</script>
</body>
</html>
