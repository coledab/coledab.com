<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&amp;family=Schibsted+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
  /* Tagline is locked to the logotype's width at every viewport: its font-size is
     a fixed 0.222 ratio of the logotype's (both clamps share the same 5.4vw term
     and crossover points), which lands within ~0.6%, and justify closes the rest.
     width:0 + min-width:100% keeps the tagline out of the column's intrinsic
     sizing, so the column hugs the h1 and justify has real slack to distribute. */
  .tagline{display:block;width:0;min-width:100%;margin:0;font-family:"Schibsted Grotesk",system-ui,sans-serif;font-weight:400;font-size:clamp(9.7px,1.1vw,15.5px);letter-spacing:.2em;text-transform:uppercase;color:rgba(242,242,240,.38);text-align:justify;text-align-last:justify;-moz-text-align-last:justify}

  html, body { margin: 0; padding: 0; background: #0a0a0b; color: #f2f2f0; -webkit-font-smoothing: antialiased; }
  body { font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
  a { color: #f2f2f0; text-decoration: none; }
  a:hover { color: #ffffff; }
  * { box-sizing: border-box; }
  input, textarea, button { font: inherit; color: inherit; }
  input::placeholder, textarea::placeholder { color: rgba(242,242,240,.28); }
  input:focus, textarea:focus { outline: none; border-color: rgba(242,242,240,.55); }
</style>
</helmet>

<div style="min-height:100vh;background:#0a0a0b;display:flex;flex-direction:column">
  <nav aria-label="Main" style="position:fixed;top:clamp(20px,3.4vw,44px);right:clamp(20px,3.4vw,44px);z-index:40;display:flex;align-items:center;gap:8px">
    <a href="index.html" style="font-size:10px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:#f2f2f0;padding:10px 18px;border:1px solid rgba(242,242,240,.14);border-radius:999px;background:rgba(10,10,11,.5);backdrop-filter:blur(8px);transition:border-color .4s cubic-bezier(.22,.61,.36,1),background .4s cubic-bezier(.22,.61,.36,1)" style-hover="border-color:#f2f2f0;background:rgba(10,10,11,.85)">Home</a>
    <a href="index.html#work" style="font-size:10px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:#f2f2f0;padding:10px 18px;border:1px solid rgba(242,242,240,.14);border-radius:999px;background:rgba(10,10,11,.5);backdrop-filter:blur(8px);transition:border-color .4s cubic-bezier(.22,.61,.36,1),background .4s cubic-bezier(.22,.61,.36,1)" style-hover="border-color:#f2f2f0;background:rgba(10,10,11,.85)">Work</a>
    <a href="about.html" style="font-size:10px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:#f2f2f0;padding:10px 18px;border:1px solid rgba(242,242,240,.14);border-radius:999px;background:rgba(10,10,11,.5);backdrop-filter:blur(8px);transition:border-color .4s cubic-bezier(.22,.61,.36,1),background .4s cubic-bezier(.22,.61,.36,1)" style-hover="border-color:#f2f2f0;background:rgba(10,10,11,.85)">About</a>
  </nav>

  <header style="padding:clamp(72px,11vh,128px) clamp(24px,4vw,48px) 0">
    <div style="max-width:1400px;width:100%;margin:0 auto"><div style="display:flex;flex-direction:column;gap:clamp(8px,1vw,14px);width:fit-content">
      <a href="index.html" style="display:block">
        <h1 style="margin:0;font-family:Fraunces,Georgia,serif;font-weight:500;font-size:clamp(44px,5.4vw,76px);letter-spacing:-.035em;line-height:.96;color:#f2f2f0">cole dab</h1>
      </a>
      <p class="tagline">MUSIC VIDEO DIRECTOR</p>
      </div>
    </div>
  </header>

  <main style="flex:1">
    <section style="max-width:1400px;margin:0 auto;padding:clamp(40px,6vh,72px) clamp(24px,4vw,48px) 0">
      <h2 style="margin:0;font-size:clamp(22px,1.95vw,27px);font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:rgba(242,242,240,.46);padding-bottom:20px;border-bottom:1px solid rgba(242,242,240,.14)">Contact</h2>

      <form onSubmit="{{ onSubmit }}" style="max-width:720px;padding:clamp(28px,4vw,52px) 0 0;display:flex;flex-direction:column;gap:clamp(20px,2.4vw,30px)">
        <label style="display:flex;flex-direction:column;gap:10px">
          <span style="font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:rgba(242,242,240,.42)">Name</span>
          <input type="text" name="name" value="{{ name }}" onChange="{{ onName }}" required="" autoComplete="name" placeholder="Your name" style="width:100%;padding:14px 0;background:transparent;border:0;border-bottom:1px solid rgba(242,242,240,.2);font-size:clamp(17px,1.8vw,22px);font-weight:400;letter-spacing:-.01em;transition:border-color .3s ease">
        </label>
        <label style="display:flex;flex-direction:column;gap:10px">
          <span style="font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:rgba(242,242,240,.42)">Message</span>
          <textarea name="message" rows="6" value="{{ message }}" onChange="{{ onMessage }}" required="" placeholder="Tell me about the project" style="width:100%;padding:14px 0;background:transparent;border:0;border-bottom:1px solid rgba(242,242,240,.2);font-size:clamp(17px,1.8vw,22px);font-weight:400;letter-spacing:-.01em;line-height:1.5;resize:vertical;transition:border-color .3s ease"></textarea>
        </label>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:20px;padding-top:clamp(4px,1vw,10px)">
          <button type="submit" style="padding:15px 34px;background:#f2f2f0;color:#0a0a0b;border:0;border-radius:999px;font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:opacity .3s ease" style-hover="opacity:.82">Send</button>
          <span style="font-size:clamp(12px,1.1vw,14px);letter-spacing:.02em;color:rgba(242,242,240,.52);opacity:{{ statusOpacity }};transition:opacity .35s ease">{{ status }}</span>
        </div>
      </form>

      <div style="padding:clamp(48px,6vw,80px) 0 0;display:flex;flex-direction:column;align-items:flex-start;gap:10px;font-size:clamp(13px,1.3vw,16px);letter-spacing:.12em;text-transform:uppercase;color:rgba(242,242,240,.42)">
        <strong style="font-weight:500;color:rgba(242,242,240,.72)">Management</strong>
        <span>Kyle Jensen / Nominal</span>
      </div>
    </section>
  </main>

  <footer style="max-width:1400px;width:100%;margin:0 auto;padding:clamp(48px,7vh,90px) clamp(24px,4vw,48px) 40px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;font-size:12px;color:rgba(242,242,240,.52)">
    <span>© {{ year }} DAB LAB, INC.</span>
    <nav aria-label="Social" style="display:flex;gap:22px">
      <a href="https://instagram.com/coledab" target="_blank" rel="noopener" style="color:rgba(242,242,240,.52);letter-spacing:.12em;font-size:12px" style-hover="color:#f2f2f0">INSTAGRAM</a>
    </nav>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { name: "", message: "", status: "" };

  submit(e) {
    e.preventDefault();
    const name = (this.state.name || "").trim();
    const message = (this.state.message || "").trim();
    if (!name || !message) {
      this.setState({ status: "Add your name and a message." });
      return;
    }
    const to = ["coledabney", "gmail.com"].join("@");
    const url = "mailto:" + to +
      "?subject=" + encodeURIComponent("Website inquiry from " + name) +
      "&body=" + encodeURIComponent(message + "\n\n— " + name);
    window.location.href = url;
    this.setState({ status: "Opening your mail app…" });
    clearTimeout(this.t);
    this.t = setTimeout(() => this.setState({ status: "Sent. Talk soon." }), 2200);
  }

  componentWillUnmount() { clearTimeout(this.t); }

  renderVals() {
    return {
      year: new Date().getFullYear(),
      name: this.state.name,
      message: this.state.message,
      status: this.state.status,
      statusOpacity: this.state.status ? 1 : 0,
      onName: e => this.setState({ name: e.target.value, status: "" }),
      onMessage: e => this.setState({ message: e.target.value, status: "" }),
      onSubmit: e => this.submit(e)
    };
  }
}

</script>
<script>
/* Fraunces has an optical-size axis, so the logotype's ink-per-px is NOT linear
   in font-size — a fixed font-size ratio can't hold across viewports. Measure the
   logotype's rendered width and size the tagline to fill exactly it. */
(function () {
  var K = null;
  function coeff(p) {
    if (K) return K;
    var probe = p.cloneNode(true);
    probe.className = "";
    probe.setAttribute("style", "position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;width:auto;min-width:0;font-family:'Schibsted Grotesk',system-ui,sans-serif;font-weight:400;letter-spacing:.2em;text-transform:uppercase;font-size:100px");
    document.body.appendChild(probe);
    var r = document.createRange();
    r.selectNodeContents(probe);
    var w = r.getBoundingClientRect().width;
    probe.remove();
    if (w > 0) K = w / 100;
    return K;
  }
  function fit() {
    var h = document.querySelector("h1");
    var p = document.querySelector(".tagline");
    if (!h || !p) return false;
    var k = coeff(p);
    if (!k) return false;
    var r = document.createRange();
    r.selectNodeContents(h);
    var w = r.getBoundingClientRect().width;
    if (!w) return false;
    p.style.fontSize = Math.max(8, Math.min(22, w / k)) + "px";
    return true;
  }
  var tries = 0;
  var timer = setInterval(function () {
    if (fit() || ++tries > 40) clearInterval(timer);
  }, 120);
  window.addEventListener("resize", function () { requestAnimationFrame(fit); });
  window.addEventListener("load", fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body>
</html>
