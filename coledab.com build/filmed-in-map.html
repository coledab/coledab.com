<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filmed in — map</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;height:100%;background:#0a0a0b;font-family:"Schibsted Grotesk",system-ui,sans-serif}
  #map{width:100%;height:100%;position:relative}
  svg{display:block;width:100%;height:100%}
  .country-filmed{cursor:pointer}
  #tooltip{position:absolute;pointer-events:none;background:rgba(10,10,11,.92);color:#f2f2f0;font-size:12px;font-weight:500;letter-spacing:.02em;padding:5px 9px;border:1px solid rgba(242,242,240,.16);border-radius:3px;opacity:0;transform:translate(-50%,-100%);white-space:nowrap;transition:opacity .15s ease;z-index:5}
</style>
</head>
<body>
<div id="map"><div id="tooltip"></div></div>
<script>
const FILMED = new Set([
  "united states of america","canada","mexico","brazil",
  "united kingdom","france","belgium","netherlands","luxembourg","germany",
  "switzerland","austria","czechia","poland","hungary","italy","spain","romania",
  "turkey","united arab emirates","qatar","armenia","kazakhstan","uzbekistan",
  "egypt","south africa","botswana","namibia","zimbabwe","tanzania","zambia",
  "belize","bahamas","saint lucia"
]);
const ALIAS = {
  "united states":"united states of america",
  "czech republic":"czechia",
  "türkiye":"turkey",
  "united republic of tanzania":"tanzania",
  "w. sahara":"western sahara",
  "st. lucia":"saint lucia",
  "the bahamas":"bahamas"
};
const key = n => {
  const k = String(n || "").toLowerCase();
  return ALIAS[k] || k;
};
const DISPLAY_NAME = {
  "united states of america": "United States",
  "czechia": "Czech Republic",
  "bahamas": "Bahamas",
  "saint lucia": "St. Lucia",
  "united republic of tanzania": "Tanzania"
};
const displayName = raw => DISPLAY_NAME[key(raw)] || raw;

// West edge clears Alaska mainland; east edge clears Kazakhstan; south edge clears Tierra del Fuego.
const LON0 = -168, LON1 = 88, LAT0 = 72, LAT1 = -56;
const RAD = Math.PI / 180;
const W = 900;
const SCALE = W / ((LON1 - LON0) * RAD);
const H = Math.round(SCALE * (LAT0 - LAT1) * RAD);
const TX = -SCALE * LON0 * RAD;
const TY = SCALE * LAT0 * RAD;

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(topo => {
  const countries = topojson.feature(topo, topo.objects.countries).features;
  const projection = d3.geoEquirectangular().scale(SCALE).translate([TX, TY]);
  projection.clipExtent([[0, 0], [W, H]]);
  const path = d3.geoPath(projection);

  const svg = d3.select("#map").insert("svg", "#tooltip")
    .attr("viewBox", "0 0 " + W + " " + H)
    .attr("preserveAspectRatio", "xMidYMid meet");

  svg.append("rect")
    .attr("width", W).attr("height", H)
    .attr("fill", "#101012");

  const tooltip = d3.select("#tooltip");

  svg.append("g").selectAll("path")
    .data(countries)
    .join("path")
    .attr("d", path)
    .attr("class", d => FILMED.has(key(d.properties.name)) ? "country-filmed" : "")
    .attr("fill", d => FILMED.has(key(d.properties.name)) ? "#ffffff" : "#1e1e21")
    .attr("stroke", d => FILMED.has(key(d.properties.name)) ? "#0a0a0b" : "#0a0a0b")
    .attr("stroke-width", d => FILMED.has(key(d.properties.name)) ? 0.6 : 0.5)
    .attr("opacity", 1)
    .on("mouseenter", function (event, d) {
      if (!FILMED.has(key(d.properties.name))) return;
      d3.select(this).attr("fill", "#ff5a36");
      tooltip.style("opacity", 1).text(displayName(d.properties.name));
    })
    .on("mousemove", function (event, d) {
      if (!FILMED.has(key(d.properties.name))) return;
      const rect = document.getElementById("map").getBoundingClientRect();
      tooltip.style("left", (event.clientX - rect.left) + "px").style("top", (event.clientY - rect.top - 10) + "px");
    })
    .on("mouseleave", function (event, d) {
      if (!FILMED.has(key(d.properties.name))) return;
      d3.select(this).attr("fill", "#ffffff");
      tooltip.style("opacity", 0);
    });

  // Saint Lucia is below the 110m dataset's size threshold — plot it as a point
  const stLucia = projection([-60.978, 13.909]);
  if (stLucia) {
    svg.append("circle")
      .attr("class", "country-filmed")
      .attr("cx", stLucia[0]).attr("cy", stLucia[1]).attr("r", 3)
      .attr("fill", "#ffffff")
      .on("mouseenter", function () {
        d3.select(this).attr("fill", "#ff5a36");
        tooltip.style("opacity", 1).text("St. Lucia");
      })
      .on("mousemove", function (event) {
        const rect = document.getElementById("map").getBoundingClientRect();
        tooltip.style("left", (event.clientX - rect.left) + "px").style("top", (event.clientY - rect.top - 10) + "px");
      })
      .on("mouseleave", function () {
        d3.select(this).attr("fill", "#ffffff");
        tooltip.style("opacity", 0);
      });
  }

  const matched = new Set(countries.map(d => key(d.properties.name)).filter(n => FILMED.has(n)));
  const missing = [...FILMED].filter(n => !matched.has(n) && n !== "saint lucia");
  if (missing.length) console.warn("Unmatched country names:", missing);
});
</script>
</body>
</html>
